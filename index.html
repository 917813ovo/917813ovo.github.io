<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>超级管理员后台</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,sans-serif;}
body{background:#f5f7fa;padding:15px;}
input, select{width:100%;padding:12px;margin:8px 0;border:1px solid #ddd;border-radius:8px;}
button{padding:10px 16px;background:#165DFF;color:#fff;border:none;border-radius:6px;cursor:pointer;margin-right:6px;margin-top:6px;}
button.del{background:#dc3454;}
.main{max-width:900px;margin:0 auto;}
.panel{background:#fff;padding:20px;border-radius:12px;margin-bottom:20px;}
.panel h3{margin-bottom:14px;color:#222;}
.item{padding:14px;border-bottom:1px solid #eee;}

.time-green{color:#28a745;font-weight:bold;}
.time-orange{color:#fd7e14;font-weight:bold;}
.time-red{color:#dc3454;font-weight:bold;}

.chat-box{height:300px;overflow-y:auto;border:1px solid #ddd;border-radius:8px;padding:10px;background:#fff;margin-top:10px;}
.chat-item{padding:8px;background:#f1f1f1;border-radius:6px;margin-bottom:6px;display:flex;justify-content:space-between;}
.chat-info{font-size:12px;color:#666;}
.chat-time{font-size:11px;color:#999;}

.notice-item{
  padding:10px;background:#fff8e1;border-radius:6px;margin-bottom:8px;
  display:flex;justify-content:space-between;align-items:center;
}
.notice-title{font-weight:bold;font-size:14px;}
.notice-content{font-size:13px;}
.flex{display:flex;gap:8px;align-items:center;}
</style>
</head>

<body>
<div class="main">
  <div class="panel"><h3>管理中心</h3></div>

  <div class="panel">
    <h3>公告管理</h3>
    <input id="noticeTitle" placeholder="公告标题">
    <input id="noticeContent" placeholder="公告内容">
    <button onclick="addNotice()">发布公告</button>
    <div id="noticeList"></div>
  </div>

  <div class="panel">
    <h3>添加游客</h3>
    <input id="vu" placeholder="账号">
    <input id="vp" placeholder="密码">
    <div class="flex">
      <input id="vt_num" type="number" placeholder="时长" style="flex:1;">
      <select id="vt_unit">
        <option value="s">秒</option>
        <option value="m" selected>分</option>
        <option value="h">时</option>
        <option value="d">天</option>
      </select>
    </div>
    <button onclick="addV()">添加游客</button>
  </div>

  <div class="panel"><h3>游客列表</h3><div id="vlist"></div></div>

  <div class="panel">
    <h3>修改游客时间</h3>
    <input id="edit_target" placeholder="游客账号">
    <div class="flex">
      <input id="d" type="number" value="0" placeholder="天" style="flex:1;">
      <input id="h" type="number" value="0" placeholder="时" style="flex:1;">
      <input id="m" type="number" value="0" placeholder="分" style="flex:1;">
      <input id="s" type="number" value="0" placeholder="秒" style="flex:1;">
    </div>
    <button onclick="setUserTime()">修改时间</button>
  </div>

  <div class="panel"><h3>修改记录</h3><div id="editLog"></div></div>

  <div class="panel">
    <h3>管理员聊天室</h3>
    <div class="chat-box" id="chatBox"></div>
    <div class="flex" style="margin-top:10px;">
      <input id="adminMsg" placeholder="消息" style="flex:1;">
      <button onclick="adminSendMsg()">发送</button>
    </div>
  </div>
</div>

<script>
function get(key) {
  try { let v = localStorage.getItem(key); return v ? JSON.parse(v) : []; } catch(e) { return []; }
}
function set(key, data) {
  try { localStorage.setItem(key, JSON.stringify(data)); } catch(e) { alert("存储失败"); }
}

function addNotice() {
  let title = document.getElementById("noticeTitle").value.trim();
  let content = document.getElementById("noticeContent").value.trim();
  if (!title || !content) { alert("填标题+内容"); return; }
  let list = get("notice");
  list.unshift({ title, content, time: new Date().toLocaleString() });
  set("notice", list);
  document.getElementById("noticeTitle").value = "";
  document.getElementById("noticeContent").value = "";
}

function loadNotice() {
  let list = get("notice");
  let dom = document.getElementById("noticeList");
  dom.innerHTML = "";
  list.forEach((item,i)=>{
    dom.innerHTML += `
    <div class="notice-item">
      <div><div class="notice-title">${item.title}</div><div>${item.content}</div></div>
      <div><small>${item.time}</small><br><button class="del" onclick="delNotice(${i})">删</button></div>
    </div>`;
  });
}

function delNotice(i) {
  let list = get("notice"); list.splice(i,1); set("notice", list);
}

function addV() {
  let user = document.getElementById("vu").value.trim();
  let pwd = document.getElementById("vp").value.trim();
  let num = Number(document.getElementById("vt_num").value)||0;
  let unit = document.getElementById("vt_unit").value;
  if (!user||!pwd||num<=0) { alert("填完整"); return; }
  let ms=0;
  if(unit=="s")ms=num*1000;
  if(unit=="m")ms=num*60000;
  if(unit=="h")ms=num*3600000;
  if(unit=="d")ms=num*86400000;
  let list=get("visitor_users");
  if(list.some(x=>x.user==user)){alert("已存在");return;}
  list.push({user,pwd,create_time:Date.now(),expire_ms:ms,login_ip:"",login_device:"",login_time:""});
  set("visitor_users",list);
}

function renderV(){
  let list=get("visitor_users");
  let now=Date.now();
  let html="";
  list.forEach((it,i)=>{
    let left=it.create_time+it.expire_ms-now;
    if(left<0)left=0;
    let d=Math.floor(left/86400000);
    let h=Math.floor((left%86400000)/3600000);
    let m=Math.floor((left%3600000)/60000);
    let s=Math.floor((left%60000)/1000);
    let cls="time-green";
    if(left<=600000)cls="time-red";
    else if(left<=3600000)cls="time-orange";
    html+=`
    <div class="item">
      ${it.user} | 剩余:<span class="${cls}">${d}天${h}时${m}分${s}秒</span><br>
      登录:${it.login_time||'未'}<br>
      <button class="del" onclick="delV(${i})">删</button>
    </div>`;
  });
  document.getElementById("vlist").innerHTML=html;
}

function delV(i){
  let list=get("visitor_users");list.splice(i,1);set("visitor_users",list);
}

function setUserTime(){
  let user=document.getElementById("edit_target").value.trim();
  let d=Number(document.getElementById("d").value)||0;
  let h=Number(document.getElementById("h").value)||0;
  let m=Number(document.getElementById("m").value)||0;
  let s=Number(document.getElementById("s").value)||0;
  let total=d*86400000+h*3600000+m*60000+s*1000;
  let list=get("visitor_users");
  let idx=list.findIndex(x=>x.user==user);
  if(idx==-1){alert("不存在");return;}
  list[idx].create_time=Date.now();
  list[idx].expire_ms=total;
  set("visitor_users",list);
  alert("成功");
}

function renderLog(){
  let log=get("user_edit_log");
  let html="";
  log.forEach(it=>{
    html+=`<div class="item">${it.oldUser} → ${it.newUser} | ${it.time}</div>`;
  });
  document.getElementById("editLog").innerHTML=html;
}

function loadChat(){
  let chat=get("chat");
  let box=document.getElementById("chatBox");
  box.innerHTML="";
  chat.forEach((it,i)=>{
    box.innerHTML+=`
    <div class="chat-item">
      <div><div class="chat-info">${it.user}</div><div>${it.text||''}</div><div class="chat-time">${it.time}</div></div>
      <button class="del" onclick="delChat(${i})">删</button>
    </div>`;
  });
  box.scrollTop=box.scrollHeight;
}

function adminSendMsg(){
  let t=document.getElementById("adminMsg").value.trim();
  if(!t)return;
  let chat=get("chat");
  chat.push({user:"【管理员】",text:t,time:new Date().toLocaleString()});
  set("chat",chat);
  document.getElementById("adminMsg").value="";
}

function delChat(i){
  let chat=get("chat");chat.splice(i,1);set("chat",chat);
}

setInterval(()=>{
  loadNotice();
  renderV();
  renderLog();
  loadChat();
},1000);
</script>
</body>
</html>
